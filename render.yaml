services:
  - type: web
    name: schoolsite
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/school.db
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-1.5-flash,gemini-1.5-flash-8b
      - key: GEMINI_RETRIES
        value: "2"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "90"
      # Google Custom Search (optional — for AI image search in tests)
      # - key: GOOGLE_CSE_KEY
      #   value: YOUR_GOOGLE_CSE_API_KEY
      # - key: GOOGLE_CSE_CX
      #   value: YOUR_CUSTOM_SEARCH_ENGINE_ID
    healthCheckPath: /
    autoDeploy: true
