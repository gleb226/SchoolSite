services:
  - type: web
    name: schoolsite
    runtime: docker
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/school.db
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-1.5-flash,gemini-1.5-flash-8b
      - key: GEMINI_RETRIES
        value: "2"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "90"
    healthCheckPath: /
    autoDeploy: true
